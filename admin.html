<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#050505" />
  <title>GSA Admin — Visitor Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .gate {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .gate__card {
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 1rem;
      padding: 2rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px;
    }
    .gate__mark {
      font-family: var(--font-display); font-weight: 700;
      font-size: 2.6rem; letter-spacing: -0.03em; line-height: 1;
      color: transparent; -webkit-text-stroke: 1.5px var(--brand);
    }
    .gate__card h1 { font-size: 1.4rem; }
    .gate__card p { margin: 0; color: var(--text-2); font-size: 0.9rem; }
    .gate__msg { color: #ff6b57; font-size: 0.85rem; min-height: 1.2em; }
    .admin { padding-block: 2rem 4rem; }
    .admin__head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.6rem;
    }
    .admin__head h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .admin__actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin-bottom: 1.6rem; }
    .stats > div {
      padding: 1.1rem 1.2rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      display: flex; flex-direction: column; gap: 0.2rem;
    }
    .stats strong { font-family: var(--font-display); font-size: 1.6rem; color: var(--brand); letter-spacing: -0.02em; }
    .stats span { font-size: 0.72rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 860px; }
    th, td { padding: 0.7rem 0.9rem; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--text-2); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; background: var(--bg); }
    tbody tr { cursor: pointer; transition: background var(--transition); }
    tbody tr:hover { background: rgba(204, 255, 0, 0.05); }
    .pill { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.72rem; border: 1px solid var(--border); }
    .pill--ok { color: var(--brand); border-color: rgba(204,255,0,0.4); }
    .pill--off { color: var(--text-2); }
    .detail {
      margin-top: 1.2rem; padding: 1.4rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      display: none;
    }
    .detail.is-open { display: block; }
    .detail h2 { font-size: 1.3rem; margin-bottom: 1rem; }
    .detail dl { display: grid; grid-template-columns: 140px 1fr; gap: 0.35rem 1rem; margin: 0 0 1.2rem; font-size: 0.85rem; }
    .detail dt { color: var(--text-2); }
    .detail dd { margin: 0; word-break: break-all; }
    .detail h3 { font-size: 1rem; margin: 1.2rem 0 0.6rem; color: var(--brand); }
    .evlog { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    .evlog div { display: flex; gap: 0.8rem; padding: 0.45rem 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .evlog div:last-child { border-bottom: 0; }
    .evlog time { color: var(--muted); flex-shrink: 0; }
    .evlog code { color: var(--text-2); word-break: break-all; }
    .empty { padding: 2.5rem 1rem; text-align: center; color: var(--text-2); }
    @media (min-width: 900px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>

<body>

  <!-- Password gate -->
  <div class="gate" id="gate" data-testid="admin-gate">
    <div class="gate__card">
      <span class="gate__mark" aria-hidden="true">GSA</span>
      <h1>Admin — Visitor Analytics</h1>
      <p>Private area. Enter your password to view visitor monitoring.</p>
      <input class="form-input" type="password" id="adminPass" placeholder="Password" autocomplete="current-password"
        data-testid="admin-password" />
      <button class="btn btn--primary" id="unlockBtn" type="button" data-testid="admin-unlock">Unlock</button>
      <p class="gate__msg" id="gateMsg" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="admin" id="dash" hidden data-testid="admin-dashboard">
    <div class="container">
      <div class="admin__head">
        <div>
          <span class="eyebrow">GSA Creatives · Private</span>
          <h1>Visitor Analytics</h1>
        </div>
        <div class="admin__actions">
          <button class="btn btn--ghost btn--sm" id="refreshBtn" type="button">Refresh</button>
          <button class="btn btn--ghost btn--sm" id="exportBtn" type="button">Export JSON</button>
          <button class="btn btn--ghost btn--sm" id="clearBtn" type="button">Clear data</button>
          <button class="btn btn--primary btn--sm" id="lockBtn" type="button">Lock</button>
        </div>
      </div>

      <div class="stats" id="statCards"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Location</th>
              <th>IP</th>
              <th>Device</th>
              <th>Lang</th>
              <th>Videos</th>
              <th>Watch time</th>
              <th>Actions</th>
              <th>Report</th>
            </tr>
          </thead>
          <tbody id="visitsBody"></tbody>
        </table>
      </div>

      <div class="detail" id="detail"></div>
    </div>
  </div>

  <script src="assets/js/admin.js" defer></script>
</body>

</html>
